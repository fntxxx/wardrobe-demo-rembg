name: Warmup Services

on:
    schedule:
        - cron: "*/8 * * * *"
    workflow_dispatch:

jobs:
    warmup:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            REMBG_WARMUP_URL: ${{ secrets.REMBG_WARMUP_URL }}
            ATTR_WARMUP_URL: ${{ secrets.ATTR_WARMUP_URL }}
            REMBG_API_TOKEN: ${{ secrets.REMBG_API_TOKEN }}
            FASHION_ATTR_API_TOKEN: ${{ secrets.FASHION_ATTR_API_TOKEN }}

        steps:
            - name: Ping rembg warmup
              run: |
                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --retry 3 \
                    --retry-delay 5 \
                    --retry-max-time 40 \
                    --max-time 120 \
                    -H "Authorization: Bearer $REMBG_API_TOKEN" \
                    "$REMBG_WARMUP_URL"

            - name: Ping fashion attr warmup
              run: |
                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --retry 3 \
                    --retry-delay 5 \
                    --retry-max-time 40 \
                    --max-time 120 \
                    -H "Authorization: Bearer $FASHION_ATTR_API_TOKEN" \
                    "$ATTR_WARMUP_URL"
